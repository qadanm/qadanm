<title id="teD">elmulator: app to scripted adapter to ECU, with Swift and Python servers compared byte for byte</title>
<desc id="deD">A phone app talks over Bluetooth to a scripted ELM327 adapter and a scripted ECU. Below, Swift and Python servers feed a conformance check that compares their output bytes.</desc>
